[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valuation-report-builder"
version = "0.1.0"
description = "Build a property valuation report (PDF + HTML) from one YAML or JSON file. Analysis tool, not a USPAP appraisal."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["jinja2>=3.1", "pydantic>=2.6", "pyyaml>=6", "playwright>=1.44"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
valuation-report = "valuation_report.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
valuation_report = ["templates/*.j2", "py.typed"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["pdf: needs a Chromium browser through Playwright"]
